<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小钎猪">
<meta name="apple-touch-icon" content="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1221">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>小钎猪 · 钎城桌宠</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
html, body { width:100%; height:100%; overflow:hidden; position:fixed; }
body {
  background: linear-gradient(180deg, #0f1221 0%, #1a1f3a 50%, #0d1030 100%);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: #fff;
}

/* ===== 星空背景 ===== */
.stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
.star {
  position:absolute; width:2px; height:2px; background:rgba(255,255,255,0.85);
  border-radius:50%; animation: twinkle 3s ease-in-out infinite;
}
@keyframes twinkle { 0%,100%{opacity:0.2} 50%{opacity:1} }

/* ===== 状态栏 ===== */
.status {
  position:fixed; top: env(safe-area-inset-top, 0); left:0; right:0; z-index:20;
  padding: 14px 18px 8px;
  background: linear-gradient(180deg, rgba(15,18,33,0.9) 0%, transparent 100%);
}
.name-row { display:flex; justify-content:space-between; align-items:center; }
.name { font-size:17px; font-weight:800; letter-spacing:0.5px; }
.sub { font-size:11px; opacity:0.55; font-weight:500; margin-left:4px; }
.mood { font-size:12px; opacity:0.7; margin-top:4px; }

/* ===== 舞台 ===== */
.stage { position:fixed; inset:0; z-index:1; }

.pet {
  position:absolute;
  bottom: 12%;
  width: 42vw;
  max-width: 260px;
  min-width: 180px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  filter: drop-shadow(0 12px 24px rgba(0,0,0,0.4));
  transform-origin: center bottom;
  will-change: transform;
  animation: idle 3.2s ease-in-out infinite;
}
@keyframes idle {
  0%,100% { transform: translateX(-50%) translateY(0) scale(1); }
  50% { transform: translateX(-50%) translateY(-6px) scale(1.015); }
}

/* 影子 */
.shadow {
  position:absolute;
  bottom: calc(12% - 8px);
  left: 50%;
  transform: translateX(-50%);
  width: 30vw;
  max-width: 180px;
  height: 16px;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0.4) 0%, transparent 70%);
  filter: blur(4px);
  z-index: 4;
  pointer-events:none;
}

/* ===== 对话气泡 ===== */
.bubble {
  position:fixed;
  top: 20%;
  left: 50%;
  transform: translateX(-50%) translateY(-10px);
  background: rgba(255,255,255,0.97);
  color: #1a1f3a;
  padding: 12px 18px;
  border-radius: 20px;
  border-bottom-left-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  max-width: 82%;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  z-index: 15;
  opacity: 0;
  transition: opacity 0.35s ease, transform 0.35s ease;
  pointer-events: none;
}
.bubble.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===== 按钮 ===== */
.controls {
  position:fixed; bottom: calc(env(safe-area-inset-bottom, 0) + 20px); left:16px; right:16px; z-index:20;
  display:grid; grid-template-columns: repeat(4, 1fr); gap:10px;
}
.btn {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  border-radius: 18px;
  padding: 14px 0;
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.2s ease;
}
.btn:active { transform: scale(0.92); background: rgba(255,255,255,0.18); }
.btn .em { font-size: 22px; display:block; margin-bottom: 3px; }

/* 跳跃动画 */
.pet.jump { animation: jump 0.7s ease-in-out; }
@keyframes jump {
  0%,100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(-40px) scale(1.05); }
}

/* 说话动效 */
.pet.talking { animation: talk 0.4s ease-in-out 3; }
@keyframes talk {
  0%,100% { transform: translateX(-50%) translateY(0) scale(1); }
  50% { transform: translateX(-50%) translateY(-4px) scale(1.03); }
}
</style>
</head>
<body>

<div class="status">
  <div class="name-row">
    <div class="name">小钎猪<span class="sub"> · DYG 钎城</span></div>
  </div>
  <div class="mood" id="mood">今天也要冲冲冲～</div>
</div>

<div class="stage">
  <div class="stars" id="stars"></div>
  <div class="shadow"></div>
  <img class="pet" id="pet" src="qiancheng-character.png" alt="小钎猪">
</div>

<div class="bubble" id="bubble">你好呀～</div>

<div class="controls">
  <div class="btn" onclick="say()"><span class="em">🎤</span>说句话</div>
  <div class="btn" onclick="pat()"><span class="em">🫶</span>摸摸头</div>
  <div class="btn" onclick="play()"><span class="em">⚡</span>一起冲</div>
  <div class="btn" onclick="sleep()"><span class="em">🌙</span>休息下</div>
</div>

<script>
const QUOTES = [
  "我始终相信坚持可以给人力量，热爱可抵岁月漫长",
  "圆满。拿到我想要的冠军吧",
  "破局密码就是整个队伍团结一致",
  "一起加油，顶峰相见",
  "小钎猪驾到～通通闪开！",
  "帅是一种感觉，你品品",
  "别摸头啦，会长不高的",
  "一波流！冲！",
  "兄弟们，团结就是力量",
  "保持状态，冲冲冲",
  "今天也要元气满满",
  "想我了就戳戳我"
];
const MOODS = ["今天也要冲冲冲～","状态超好！","有点困...","饿了饿了","准备开黑！","训练中勿扰","想念钎宝们"];

function rand(x){ return x[Math.floor(Math.random()*x.length)] }

// 星空
(function(){
  const s = document.getElementById('stars');
  for(let i=0;i<50;i++){
    const el = document.createElement('div');
    el.className = 'star';
    el.style.left = Math.random()*100 + '%';
    el.style.top = Math.random()*100 + '%';
    el.style.animationDelay = Math.random()*3 + 's';
    el.style.width = el.style.height = (Math.random()*2+1) + 'px';
    s.appendChild(el);
  }
})();

const pet = document.getElementById('pet');
const bubble = document.getElementById('bubble');
const mood = document.getElementById('mood');
let bubbleTimer = null;

function showBubble(text){
  bubble.textContent = text;
  bubble.classList.add('show');
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(()=>bubble.classList.remove('show'), 2800);
}

function anim(cls, dur=700){
  pet.classList.add(cls);
  setTimeout(()=>pet.classList.remove(cls), dur);
}

function say(){
  showBubble(rand(QUOTES));
  anim('talking', 500);
  speak(rand(QUOTES));
}
function pat(){
  showBubble("别摸头啦，会长不高的～");
  anim('talking', 400);
  speak("别摸头啦");
}
function play(){
  showBubble("一波流！冲！");
  anim('jump', 700);
  speak("一波流冲");
}
function sleep(){
  showBubble("z z z 晚安 💤");
  speak("晚安");
}

function speak(text){
  if(!'speechSynthesis' in window) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 1.05; u.pitch = 1.05;
    window.speechSynthesis.speak(u);
  } catch(e){}
}

// 页面加载说一句
window.addEventListener('load', ()=>{
  setTimeout(()=>showBubble(rand(QUOTES)), 400);
});

// 定时换心情
setInterval(()=>{ mood.textContent = rand(MOODS); }, 15000);

// 点击宠物也能说话
pet.addEventListener('click', (e)=>{ e.stopPropagation(); say(); });
</script>
</body>
</html>
